name: Build SM-M145F (Galaxy M14 4G) Kernel

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub release
        type: boolean
        default: true
      release_tag:
        description: Release tag (leave empty to use the tag ref, or manual-<run_number>)
        type: string
        required: false
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write
    env:
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl flex gcc git \
            libelf-dev libssl-dev lld llvm clang \
            python3 python3-pip rsync zip unzip \
            dwarves pahole device-tree-compiler \
            libncurses-dev busybox cpio \
            libselinux1-dev openssl gawk p7zip-full git

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Configure Git identity
        run: |
          git config --global user.name "Subham Nayak"
          git config --global user.email "fstab.subhu@gmail.com"

      - name: Build SM-M145F (Galaxy M14 4G) kernel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Save ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Prune old ccache entries
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="ccache-${RUNNER_OS}-${{ github.ref_name }}-"
          gh cache list --key "$prefix" --limit 100 --json id,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[1:] | .[].id' |
            xargs -r -n1 gh cache delete

      - name: Generate SHA-256 checksum
        run: |
          sha256sum boot.img > SHA256SUM.txt
          [ -f Image ] && sha256sum Image >> SHA256SUM.txt || true
          for ak in AnyKernel3*.zip; do
            [ -f "$ak" ] && sha256sum "$ak" >> SHA256SUM.txt || true
          done
          cat SHA256SUM.txt

      - name: Attest boot.img
        uses: actions/attest@v4
        continue-on-error: true
        with:
          subject-path: ./boot.img

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boot-M145F
          path: |
            boot.img
            Image
            AnyKernel3*.zip
            SHA256SUM.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Generate release notes
        if: always()
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="build-${GITHUB_RUN_NUMBER}"
          fi

          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          if [ -f ".github/scripts/generate-release-notes.sh" ]; then
            bash .github/scripts/generate-release-notes.sh "$tag" > release-notes.md || echo "Automated build $tag" > release-notes.md
          else
            echo "Automated build $tag" > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub Release
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FILES=()
          [ -f boot.img ] && RELEASE_FILES+=(./boot.img)
          [ -f Image ] && RELEASE_FILES+=(./Image)
          for ak in AnyKernel3*.zip; do
            [ -f "$ak" ] && RELEASE_FILES+=("./$ak")
          done
          [ -f SHA256SUM.txt ] && RELEASE_FILES+=(./SHA256SUM.txt)

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, updating assets and notes..."
            gh release upload "$RELEASE_TAG" "${RELEASE_FILES[@]}" --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              "${RELEASE_FILES[@]}" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi
